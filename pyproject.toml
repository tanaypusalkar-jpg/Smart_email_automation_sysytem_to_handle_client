[project]
name = "email-automation-system"
version = "0.2.0"
description = "AI-powered email automation: classifies, drafts, and sends email replies using the Claude API, with a lightweight RAG layer, a persistent audit log, rate limiting, and an OAuth gate on the send endpoint."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "anthropic>=0.40.0",
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "chromadb>=0.5.5",
    "aiosmtplib>=3.0.2",
    "tenacity>=9.0.0",
    "sqlalchemy>=2.0.35",
    "slowapi>=0.1.9",
    "google-auth>=2.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
